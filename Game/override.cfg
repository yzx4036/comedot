; 由 _ToolScript/select_game.sh 生成（改动会被下次切换覆盖）
; 当前激活：Game/MyGame
; 切换：_ToolScript/select_game.sh <业务名>    查看：_ToolScript/select_game.sh --list

[application]
config/name="Comedot Example"

[comedot]
settings/comedotProjectSettingsPath="res://Game/MyGame/ComedotProjectSettings.tres"

; ---- 业务片段：Game/MyGame/override.cfg ----
; 本业务专属的项目设置片段（select_game.sh 切换时并入根 Game/override.cfg）
; 只能放 [application]/[comedot] 之外的小节 —— 那两个由 select_game.sh 负责
;
; 这个示例业务是「框架功能测试台」，需要一屏放下多行多列的按钮网格，
; 所以把逻辑分辨率从框架默认的 320×180 提到 1280×720（窗口 1:1，整数缩放）。

[display]

window/size/viewport_width=1280
window/size/viewport_height=720
window/size/window_width_override=1280
window/size/window_height_override=720
window/stretch/scale_mode="integer"
