# ============================================================================
# comedot 框架锚定规格（framework anchor spec）
# ----------------------------------------------------------------------------
# 由 lib.sh 载入，被 new_project.sh / update_project.sh / verify_project.sh 共用。
# 每一项都必须与「当前」comedot 框架的真实结构一致：
#   框架升级后如果结构变了，先改这里，再跑 update_project.sh。
# 校验入口：_ToolScript/verify_project.sh
# ============================================================================


# ---------------------------------------------------------------------------
# 框架层（Game/ 之外 = 上游框架层，可被上游覆盖，禁止放游戏内容）
# ---------------------------------------------------------------------------

# 必需目录：缺任何一项说明框架结构已变化，脚本必须同步更新
FRAMEWORK_REQUIRED_DIRS="Assets AutoLoad Components Entities Resources Scenes Scripts Templates Tests UI addons"

# 必需文件
FRAMEWORK_REQUIRED_FILES="project.godot ComedotProjectSettings.tres Comedot.csproj Comedot.sln .gitignore"

# 可选目录：存在才校验，不存在不报错
FRAMEWORK_OPTIONAL_DIRS="docs Notes _ConfigTables .github"

# project.godot 中必须存在的启动覆盖设置行（框架 → 游戏层的唯一项目级入口）
FRAMEWORK_OVERRIDE_SETTING_LINE='config/project_settings_override="res://Game/override.cfg"'

# .gitignore 中必须存在的 Game 边界规则（仅「双仓」旧模型使用；单仓模型下 Game/ 必须被跟踪）
FRAMEWORK_GAME_IGNORE_RULE='/Game/*'

# --- 单仓 · Game 下多业务模型（当前目标形态，见 docs/multi-game-layout.md）----
# Game/ 由本仓跟踪；下面是每个游戏业务的契约文件与共享开关
GAME_ROOT_REL="Game"
GAME_OVERRIDE_REL="Game/override.cfg"
GAME_PER_BUSINESS_SETTINGS="ComedotProjectSettings.tres"
# 每个业务默认的可玩场景命名（<业务>/Scenes/Levels/<业务>Main.tscn）
GAME_MAIN_SCENE_TEMPLATE="{game}/Scenes/Levels/{game}Main.tscn"
# 业务目录之间不允许互相引用（隔离检查用）
GAME_ISOLATION_PREFIX="Game/"

# Comedot 设置资源脚本：游戏层 ComedotProjectSettings.tres 通过它注册脚本类
FRAMEWORK_SETTINGS_SCRIPT="addons/Comedot/ComedotProjectSettings.gd"

# 框架启动链（override.cfg 不覆盖 run/main_scene 时走这条链）
# project.godot application/run/main_scene → Scenes/Launch/Logo/IOLogoScene.tscn → Scenes/Launch/GameFrame.tscn
#   → 菜单 Start 按钮 → GameState.startMainScene() → Settings.mainGameScenePath
FRAMEWORK_LAUNCH_SCENE="Scenes/Launch/Logo/IOLogoScene.tscn"
FRAMEWORK_MENU_SCENE="Scenes/Launch/GameFrame.tscn"


# ---------------------------------------------------------------------------
# 游戏层（Game/ = 游戏业务仓的仓库根）
# ---------------------------------------------------------------------------

# 游戏仓根必需文件
GAME_REPO_REQUIRED_FILES="override.cfg ComedotProjectSettings.tres"

# 游戏层必建目录：镜像框架结构，与 addons/Comedot/GameProjectInitializer.gd 的 leafFolders 一致
GAME_MIRROR_LEAF_DIRS="Assets/Audio Assets/Fonts Assets/Images Assets/Shaders Assets/Themes Components/Combat Components/Control Components/Interaction Components/Movement Components/UI Entities/Characters Entities/Objects Entities/World Resources/Actions Resources/Config Resources/Items Resources/Stats Scenes/Boot Scenes/Launch Scenes/Levels Scenes/Menus Scenes/Testbeds Scripts/Boot Scripts/Gameplay Scripts/UI Scripts/Utils UI/HUD UI/Menus UI/Widgets Tests/Manual Tests/Regression Docs"

# 游戏层可选目录（框架根有 _ConfigTables 时镜像一份给游戏自己的 Luban 表用）
GAME_OPTIONAL_DIRS="_ConfigTables/Excel _ConfigTables/Configs"

# 已从框架删除、禁止在游戏层引用的废弃锚点
# 依据：上游 af4bc065 "Remove Start.gd and its awkward requirements" 删除了 Scripts/Start.gd
GAME_FORBIDDEN_PATTERNS="extends Start|res://Scripts/Start.gd"


# ---------------------------------------------------------------------------
# 命名规范
# ---------------------------------------------------------------------------

# 仓位/目录命名：<PREFIX><PROJ> 例：GDGameProj<Proj>
#   框架仓 = Comedot_<PREFIX><PROJ>      （origin = 项目框架仓，upstream = 框架上游）
#   游戏仓 = Comedot_<PREFIX><PROJ>Game  （挂载在框架仓的 Game/ 目录，Game/ 即其仓库根）
DEFAULT_REPO_PREFIX="GDGameProj"
DEFAULT_OWNER="yzx4036"
DEFAULT_FRAMEWORK_BRANCH="develop"
